<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="500" viewBox="0 0 1300 500" role="img" aria-labelledby="title desc">
  <title id="title">Przepływ zwykłej gry</title>
  <desc id="desc">Lokalna ścieżka od przerwania wiązki do dźwięku oraz opcjonalne zdarzenie wysyłane do aplikacji.</desc>
  <defs>
    <marker id="arrow-blue-game" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple-game" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .section { font-size: 16px; font-weight: 700; }
      .title { font-size: 16px; font-weight: 700; }
      .text { font-size: 14px; }
      .number { font-size: 14px; font-weight: 700; fill: #1d4ed8; }
    </style>
  </defs>

  <rect x="1" y="1" width="1298" height="498" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="60" width="1240" height="210" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="label section" x="650" y="92">KRYTYCZNA ŚCIEŻKA LOKALNA</text>
  <rect x="540" y="300" width="500" height="150" rx="18" fill="#faf5ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="8 7"/>
  <text class="label section" x="790" y="330">OPCJONALNA TELEMETRIA</text>

  <g>
    <rect x="70" y="130" width="170" height="80" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text class="label title" x="155" y="162">Użytkownik</text>
    <text class="label text" x="155" y="186">przerywa wiązkę</text>
  </g>
  <g>
    <rect x="290" y="130" width="160" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text class="label title" x="370" y="176">15 czujników</text>
  </g>
  <g>
    <rect x="500" y="120" width="220" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text class="label title" x="610" y="157">STM32WB55</text>
    <text class="label text" x="610" y="181">filtruje i identyfikuje</text>
    <text class="label text" x="610" y="201">StringId</text>
  </g>
  <g>
    <rect x="780" y="130" width="190" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text class="label title" x="875" y="162">Podsystem audio</text>
    <text class="label text" x="875" y="186">uruchamia dźwięk</text>
  </g>
  <g>
    <rect x="1030" y="130" width="190" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label title" x="1125" y="176">Dźwięk instrumentu</text>
  </g>
  <g>
    <rect x="690" y="350" width="220" height="70" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <text class="label title" x="800" y="379">Aplikacja Android</text>
    <text class="label text" x="800" y="401">aktualizuje UI lub statystyki</text>
  </g>

  <line x1="240" y1="170" x2="288" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue-game)"/>
  <line x1="450" y1="170" x2="498" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue-game)"/>
  <line x1="720" y1="170" x2="778" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue-game)"/>
  <line x1="970" y1="170" x2="1028" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue-game)"/>
  <text class="label number" x="264" y="158">1</text>
  <text class="label number" x="474" y="158">2</text>
  <text class="label number" x="749" y="158">3</text>
  <text class="label number" x="999" y="158">4</text>

  <path d="M 610 220 L 610 385 L 688 385" fill="none" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-purple-game)"/>
  <rect x="575" y="276" width="180" height="28" rx="7" fill="#ffffff"/>
  <text class="label text" x="665" y="296" fill="#7e22ce">jeśli BLE jest połączone</text>
  <text class="label text" x="650" y="478">Brak telefonu lub BLE nie przerywa generowania dźwięku.</text>
</svg>
