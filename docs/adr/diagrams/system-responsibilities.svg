<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Diagram odpowiedzialności systemu HARFA</title>
  <desc id="desc">Podział odpowiedzialności między instrument ze STM32WB55 a aplikację Android oraz komunikacja BLE GATT.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .group-title { font-size: 20px; font-weight: 700; }
      .node-title { font-size: 16px; font-weight: 700; }
      .node-text { font-size: 14px; }
      .edge-label { font-size: 14px; font-weight: 700; fill: #0f766e; }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .edge-purple { fill: none; stroke: #9333ea; stroke-width: 2.5; marker-end: url(#arrow-purple); }
      .edge-gray { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect x="1" y="1" width="1498" height="758" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="40" y="90" width="620" height="610" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <rect x="840" y="90" width="620" height="610" rx="18" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/>
  <text class="label group-title" x="350" y="130">INSTRUMENT</text>
  <text class="label group-title" x="1150" y="130">APLIKACJA ANDROID</text>

  <rect x="640" y="20" width="220" height="50" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text class="label node-title" x="750" y="52">Użytkownik</text>

  <g>
    <rect x="80" y="190" width="180" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text class="label node-title" x="170" y="222">15 czujników</text>
    <text class="label node-text" x="170" y="247">wykrywanie wiązki</text>
  </g>
  <g>
    <rect x="80" y="500" width="180" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text class="label node-title" x="170" y="532">Układ zasilania</text>
    <text class="label node-text" x="170" y="557">i pomiar baterii</text>
  </g>
  <g>
    <rect x="80" y="330" width="180" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text class="label node-title" x="170" y="362">7 przełączników</text>
    <text class="label node-text" x="170" y="387">tonacja C, D, E, F, G, A, H</text>
  </g>
  <g>
    <rect x="300" y="330" width="190" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text class="label node-title" x="395" y="366">STM32WB55</text>
    <text class="label node-text" x="395" y="392">stan sprzętu i BLE GATT</text>
  </g>
  <g>
    <rect x="510" y="190" width="120" height="70" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text class="label node-title" x="570" y="232">15 diod LED</text>
  </g>
  <g>
    <rect x="500" y="330" width="140" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text class="label node-title" x="570" y="352">Wyświetlacz</text>
    <text class="label node-title" x="570" y="372">OLED</text>
    <text class="label node-text" x="570" y="394">stan baterii</text>
  </g>
  <g>
    <rect x="500" y="500" width="140" height="70" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text class="label node-title" x="570" y="532">Podsystem</text>
    <text class="label node-title" x="570" y="554">audio</text>
  </g>

  <g>
    <rect x="880" y="190" width="170" height="70" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <text class="label node-title" x="965" y="232">Katalog utworów</text>
  </g>
  <g>
    <rect x="1100" y="190" width="160" height="70" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/>
    <text class="label node-title" x="1180" y="232">Logika lekcji</text>
  </g>
  <g>
    <rect x="1300" y="190" width="130" height="70" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <text class="label node-title" x="1365" y="220">Interfejs</text>
    <text class="label node-title" x="1365" y="242">użytkownika</text>
  </g>
  <g>
    <rect x="1090" y="370" width="180" height="80" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/>
    <text class="label node-title" x="1180" y="417">Klient BLE</text>
  </g>
  <g>
    <rect x="880" y="510" width="170" height="70" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <text class="label node-title" x="965" y="552">Ustawienia aplikacji</text>
  </g>
  <g>
    <rect x="1290" y="510" width="140" height="70" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <text class="label node-title" x="1360" y="540">Postęp</text>
    <text class="label node-title" x="1360" y="562">użytkownika</text>
  </g>

  <path class="edge-gray" d="M 700 70 L 700 150 L 170 150 L 170 188"/>
  <path class="edge-gray" d="M 800 70 L 800 150 L 1365 150 L 1365 188"/>
  <path class="edge-blue" d="M 260 230 L 280 230 L 280 375 L 298 375"/>
  <path class="edge-blue" d="M 260 540 L 280 540 L 280 395 L 298 395"/>
  <path class="edge-blue" d="M 260 370 L 298 370"/>
  <path class="edge-blue" d="M 490 350 L 500 350 L 500 225 L 508 225"/>
  <path class="edge-blue" d="M 490 385 L 498 385"/>
  <path class="edge-blue" d="M 490 400 L 495 400 L 495 535 L 498 535"/>

  <path d="M 395 420 L 395 440 L 700 440 L 700 410 L 1090 410" fill="none" stroke="#0f766e" stroke-width="3.5" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <rect x="715" y="393" width="145" height="34" rx="8" fill="#ffffff" stroke="#99f6e4"/>
  <text class="label edge-label" x="787" y="416">BLE GATT</text>

  <path class="edge-purple" d="M 1050 225 L 1098 225"/>
  <path class="edge-purple" d="M 1260 225 L 1298 225"/>
  <path class="edge-purple" d="M 1180 260 L 1180 368"/>
  <path class="edge-purple" d="M 1260 245 L 1280 245 L 1280 545 L 1288 545"/>
  <path class="edge-purple" d="M 1360 510 L 1360 262"/>
  <path class="edge-purple" d="M 1050 545 L 1070 545 L 1070 650 L 1440 650 L 1440 225 L 1432 225"/>
</svg>
