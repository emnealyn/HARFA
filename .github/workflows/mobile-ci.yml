name: Mobile CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - 'mobile/**'
              - 'docs/protocol/**'
              - '.github/workflows/mobile-ci.yml'
  
  verify:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --continue
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-reports
          path: |
            mobile/app/build/reports/
            mobile/app/build/test-results/
          retention-days: 14

  release:
    needs: [changes, verify]
    if: github.event_name == 'push' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true
      - run: ./gradlew assembleRelease
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-release-reports
          path: mobile/app/build/reports/
          retention-days: 14